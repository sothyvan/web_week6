<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="practice-form2.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Create Account</h1>
            <br>
        </div>
        
        <div class="form-container">
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName" class="required">First name</label>
                        <input type="text" id="firstName" placeholder="Enter your first name" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last name</label>
                        <input type="text" id="lastName" placeholder="Enter your last name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="required">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="required">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="required">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Enter your password again" required>
                </div>
                
                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <label class="custom-radio">Male
                            <input type="radio" name="gender" value="male">
                            <span class="radio-btn"></span>
                        </label>
                        <label class="custom-radio">Female
                            <input type="radio" name="gender" value="female">
                            <span class="radio-btn"></span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Hobbies</label>
                    <div class="checkbox-group">
                        <label class="custom-checkbox">Music
                            <input type="checkbox" value="music">
                            <span class="checkmark"></span>
                        </label>
                        <label class="custom-checkbox">Sports
                            <input type="checkbox" value="sports">
                            <span class="checkmark"></span>
                        </label>
                        <label class="custom-checkbox">Travel
                            <input type="checkbox" value="travel">
                            <span class="checkmark"></span>
                        </label>
                        <label class="custom-checkbox">Movies
                            <input type="checkbox" value="movies">
                            <span class="checkmark"></span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="incomeSource">Source of Income</label>
                    <select id="incomeSource">
                        <option>Employed</option>
                        <option>Self-employed</option>
                        <option>Student</option>
                        <option>Unemployed</option>
                        <option>Retired</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="income">Income</label>
                    <div class="range-container">
                        <input type="range" id="income" min="0" max="20000" value="10000" step="1000">
                    </div>
                    <div class="range-labels">
                        <span>0</span>
                        <span>20K</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="profilePicture">Upload Profile Picture</label>
                    <div class="file-input-container">
                        <input type="file" id="profilePicture">
                    </div>
                    <div class="file-name">No file chosen</div>
                </div>
                
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" min="18" max="100" value="18">
                </div>
                
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" placeholder="Tell us about yourself..."></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Create Account</button>
                
            </form>
        </div>
    </div>
</body>
</html>
